description: Dynamic acceleration for relative pointer events

compatible: "zmk,input-processor-trackball-accel"

include: ip_zero_param.yaml

properties:
  type:
    type: int
    required: true
  codes:
    type: array
    required: true
  base-scale:
    type: int
    default: 1000
    description: Base scale in permille. 1000 means 1.0x.
  max-scale:
    type: int
    default: 2200
    description: Maximum scale in permille once acceleration saturates.
  acceleration-threshold:
    type: int
    default: 150
    description: Smoothed counts per second where acceleration starts.
  acceleration-cap:
    type: int
    default: 1400
    description: Smoothed counts per second where max-scale is reached.
  reset-ms:
    type: int
    default: 40
    description: Idle timeout before velocity history is reset.
  smoothing-percent:
    type: int
    default: 35
    description: Weight of the latest sample in the smoothed speed estimate.
